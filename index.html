<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        input { padding: 10px; border-radius: 5px; border: none; margin-bottom: 10px; width: 80%; }
        button { padding: 10px 20px; border-radius: 5px; border: none; background: #007bff; color: white; cursor: pointer; }
        #chat { display: none; }
        #poruke { border: 1px solid #333; height: 300px; overflow-y: scroll; background: #1e1e1e; padding: 10px; text-align: left; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="zakljucano">
        <h2>🔒 Unesi kod</h2>
        <input type="password" id="sifraUnos" placeholder="Kod...">
        <br>
        <button onclick="otkljucaj()">Potvrdi</button>
    </div>

    <div id="chat">
        <h2>💬 Grupa</h2>
        <div id="poruke"></div>
        <br>
        <input type="text" id="porukaTekst" placeholder="Poruka...">
        <button onclick="posalji()">Pošalji</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function otkljucaj() {
            socket.emit('pokusaj_otkljucavanja', document.getElementById('sifraUnos').value);
        }
        socket.on('otkljucano', () => {
            document.getElementById('zakljucano').style.display = 'none';
            document.getElementById('chat').style.display = 'block';
        });
        socket.on('greska', (m) => alert(m));
        function posalji() {
            socket.emit('nova_poruka', document.getElementById('porukaTekst').value);
            document.getElementById('porukaTekst').value = '';
        }
        socket.on('prikazi_poruku', (t) => {
            document.getElementById('poruke').innerHTML += '<p>' + t + '</p>';
        });
    </script>
</body>
</html>
